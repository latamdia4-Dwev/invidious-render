# ------------------------------------------------------------------------------
# Blueprint de Render.com para Invidious Full-Stack con Video Playback
# Version: 2.20261112.8
# ------------------------------------------------------------------------------
# Arquitectura:
#   1. Base de datos PostgreSQL gestionada (invidious-db)
#   2. Servicio Web Invidious compilado en Crystal (invidious)
#   3. Servicio Privado Invidious Companion para extraccion de streams (invidious-companion)
# ------------------------------------------------------------------------------

databases:
  - name: invidious-db
    databaseName: invidious
    user: kemal
    plan: free

services:
  # ----------------------------------------------------------------------------
  # Servicio Web Principal: Invidious
  # ----------------------------------------------------------------------------
  - type: web
    name: invidious
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter        # Recomendado: starter (el build compila Crystal estatico)
    healthCheckPath: /
    envVars:
      - key: INVIDIOUS_DATABASE_URL
        fromDatabase:
          name: invidious-db
          property: connectionString
      - key: INVIDIOUS_HMAC_KEY
        generateValue: true
      - key: INVIDIOUS_PORT
        value: "10000"
      - key: INVIDIOUS_DOMAIN
        sync: false      # Ej: tu-instancia.onrender.com
      - key: INVIDIOUS_INVIDIOUS_COMPANION_KEY
        value: "ea6de19709a408df"
      - key: INVIDIOUS_FORCE_LOCAL
        value: "true"
      - key: INVIDIOUS_SERVER_ID_COOKIE_NAME
        value: "COMPANION_ID"
      - key: INVIDIOUS_CHECK_BACKENDS_INTERVAL
        value: "30"

  # ----------------------------------------------------------------------------
  # Servicio Privado: Invidious Companion (resuelve tokens y streams de YouTube)
  # ----------------------------------------------------------------------------
  - type: pserv
    name: invidious-companion
    runtime: image
    image:
      url: quay.io/invidious/invidious-companion:latest
    plan: free           # O starter segun disponibilidad en Render
    envVars:
      - key: SERVER_SECRET_KEY
        value: "ea6de19709a408df"
      - key: PORT
        value: "8282"
      - key: HOST
        value: "0.0.0.0"
      - key: SERVER_BASE_PATH
        value: "/companion"
